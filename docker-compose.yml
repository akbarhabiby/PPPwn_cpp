services:
  pppwn-web:
    image: pppwn-web:linux-amd64
    container_name: pppwn-web
    restart: unless-stopped
    # Host networking lets libpcap access physical interfaces on Linux.
    # Do not publish ports when using network_mode: host.
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      PPPWN_INTERFACE: ${PPPWN_INTERFACE:-en7}
      PPPWN_FIRMWARE: ${PPPWN_FIRMWARE:-1100}
      PPPWN_STAGE1: /payloads/stage1.bin
      PPPWN_STAGE2: /payloads/stage2.bin
      WEB_HOST: 0.0.0.0
      WEB_PORT: 8080
    volumes:
      - ./payloads:/payloads:ro
